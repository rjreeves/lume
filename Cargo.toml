[package]
name = "b3changes"
version = "0.1.0"
edition = "2024"
description = "Detect recursive folder changes with BLAKE3"

[dependencies]
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[profile.release]
strip = true
lto = true
codegen-units = 1

